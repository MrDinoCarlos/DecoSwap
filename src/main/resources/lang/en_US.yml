guide.title: "<aqua><bold>DecoSwap</bold></aqua>"
guide.author: "<gray>MrDinoCarlos · 0.1.3</gray>"
guide.page.1: "<aqua><bold>DECOSWAP</bold></aqua><newline><dark_gray>QUICK GUIDE · <version></dark_gray><newline><newline><gold>Decorations you can save,<newline>place and remove whenever you want.</gold><newline><newline><white>SELECT</white> <gray>→</gray> <white>SAVE</white><newline><white>PLACE</white> <gray>→</gray> <white>REMOVE</white><newline><newline><gray>No resource pack · GUI with custom heads</gray><newline><newline><click:open_url:'https://mrdino.es/'><underlined><aqua>mrdino.es</aqua></underlined></click> <dark_gray>·</dark_gray> <click:open_url:'https://github.com/MrDinoCarlos/DecoSwap/wiki'><underlined><aqua>Wiki</aqua></underlined></click>"
guide.page.2: "<aqua><bold>01 · START</bold></aqua><newline><gray>────────────</gray><newline><newline><yellow>1</yellow> <aqua>/ds wand</aqua><newline><gray>Receive the selector.</gray><newline><newline><yellow>2</yellow> <aqua>/ds mode object</aqua><newline><gray>Use individual selection mode.</gray><newline><newline><yellow>3</yellow> <aqua>/ds save MyDecoration</aqua><newline><gray>Save without removing anything.</gray><newline><newline><gold>Tip:</gold> <gray>your current position becomes the initial home location.</gray>"
guide.page.3: "<aqua><bold>02 · EXACT OBJECTS</bold></aqua><newline><gray>────────────</gray><newline><newline><gray>In OBJECT mode:</gray><newline><aqua>•</aqua> <white>Click</white> <gray>a block to select it.</gray><newline><aqua>•</aqua> <white>Click</white> <gray>an entity to select it.</gray><newline><aqua>•</aqua> <white>Click again</white> <gray>to remove it.</gray><newline><newline><aqua>◆</aqua> <gray>Blue outlines are private Display Entities. No particles.</gray><newline><newline><gold>Important:</gold> <gray>players are never saved.</gray>"
guide.page.4: "<aqua><bold>03 · REGIONS</bold></aqua><newline><gray>────────────</gray><newline><newline><aqua>/ds mode region</aqua><newline><gray>Left click · Position 1<newline>Right click · Position 2</gray><newline><newline><white>Import only what you need:</white><newline><aqua>/ds select region blocks</aqua><newline><aqua>/ds select region entities</aqua><newline><aqua>/ds select region all</aqua><newline><newline><gray>The region becomes exact objects. You can remove individual pieces afterward.</gray>"
guide.page.5: "<aqua><bold>04 · SAVE</bold></aqua><newline><gray>────────────</gray><newline><newline><aqua>/ds save [name]</aqua><newline><gray>Create or update a Decoration.<newline>The world stays unchanged.</gray><newline><newline><aqua>/ds update [name]</aqua><newline><gray>Explicit update alias.</gray><newline><newline><gold>Optional Anchor</gold><newline><gray>Use /ds anchor set only when you want a different home reference.</gray>"
guide.page.6: "<aqua><bold>05 · PACK / PLACE / REMOVE</bold></aqua><newline><gray>────────────</gray><newline><newline><aqua>/ds pack [name]</aqua><newline><gray>Save first, then remove only selected objects.</gray><newline><newline><aqua>/ds place [name]</aqua><newline><gray>Place at home. Add </gray><white>here</white><gray> to place it where you stand.</gray><newline><newline><aqua>/ds remove [name]</aqua><newline><gray>Remove the instance and restore the previous state.</gray>"
guide.page.7: "<aqua><bold>06 · GROUPS</bold></aqua><newline><gray>────────────</gray><newline><newline><aqua>/ds group create Christmas</aqua><newline><aqua>/ds group add Christmas Tree</aqua><newline><aqua>/ds group add Christmas Lights</aqua><newline><newline><aqua>/ds place Christmas</aqua><newline><aqua>/ds remove Christmas</aqua><newline><newline><gray>The same commands work for a Decoration or a Group.</gray>"
guide.page.8: "<aqua><bold>07 · CHANGES</bold></aqua><newline><gray>────────────</gray><newline><newline><red>◆ RED = CHANGE DETECTED</red><newline><gray>Admins receive red outlines and a report with names, types and coordinates.</gray><newline><newline><aqua>/ds changes [name]</aqua><newline><gray>Request an immediate scan.</gray><newline><newline><aqua>/ds save [name]</aqua><newline><gray>Update the template.</gray><newline><aqua>/ds save [name] --force</aqua><newline><gray>Confirm an overwrite.</gray>"
guide.page.9: "<aqua><bold>08 · SAFETY</bold></aqua><newline><gray>────────────</gray><newline><newline><green>✓</green> <gray>Place snapshots the world before changes.</gray><newline><green>✓</green> <gray>Remove checks conflicts before restoring.</gray><newline><green>✓</green> <gray>Only DecoSwap-spawned entities are removed.</gray><newline><newline><gold>First Pack note</gold><newline><gray>An old block DecoSwap never tracked cannot be recovered magically.</gray><newline><newline><click:open_url:'https://github.com/MrDinoCarlos/DecoSwap/wiki'><underlined><aqua>Advanced help → Wiki</aqua></underlined></click>"
