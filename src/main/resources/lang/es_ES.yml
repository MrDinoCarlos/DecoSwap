guide.title: "<aqua><bold>DecoSwap</bold></aqua>"
guide.author: "<gray>MrDinoCarlos · 0.1.3</gray>"
guide.page.1: "<aqua><bold>DECOSWAP</bold></aqua><newline><dark_gray>GUÍA RÁPIDA · <version></dark_gray><newline><newline><gold>Decoraciones que puedes guardar,<newline>colocar y retirar cuando quieras.</gold><newline><newline><white>SELECCIONAR</white> <gray>→</gray> <white>GUARDAR</white><newline><white>COLOCAR</white> <gray>→</gray> <white>RETIRAR</white><newline><newline><gray>Sin resource pack · GUI con cabezas personalizadas</gray><newline><newline><click:open_url:'https://mrdino.es/'><underlined><aqua>mrdino.es</aqua></underlined></click> <dark_gray>·</dark_gray> <click:open_url:'https://github.com/MrDinoCarlos/DecoSwap/wiki'><underlined><aqua>Wiki</aqua></underlined></click>"
guide.page.2: "<aqua><bold>01 · EMPEZAR</bold></aqua><newline><gray>────────────</gray><newline><newline><yellow>1</yellow> <aqua>/ds wand</aqua><newline><gray>Recibe el selector.</gray><newline><newline><yellow>2</yellow> <aqua>/ds mode object</aqua><newline><gray>Activa la selección individual.</gray><newline><newline><yellow>3</yellow> <aqua>/ds save MiDecoracion</aqua><newline><gray>Guarda sin borrar nada del mundo.</gray><newline><newline><gold>Consejo:</gold> <gray>tu posición actual será la ubicación inicial.</gray>"
guide.page.3: "<aqua><bold>02 · OBJETOS EXACTOS</bold></aqua><newline><gray>────────────</gray><newline><newline><gray>En modo OBJECT:</gray><newline><aqua>•</aqua> <white>Pulsa</white> <gray>un bloque para seleccionarlo.</gray><newline><aqua>•</aqua> <white>Pulsa</white> <gray>una entidad para seleccionarla.</gray><newline><aqua>•</aqua> <white>Vuelve a pulsar</white> <gray>para quitarla.</gray><newline><newline><aqua>◆</aqua> <gray>Los contornos azules son Display privados. No usan partículas.</gray><newline><newline><gold>Importante:</gold> <gray>los jugadores nunca se guardan.</gray>"
guide.page.4: "<aqua><bold>03 · REGIONES</bold></aqua><newline><gray>────────────</gray><newline><newline><aqua>/ds mode region</aqua><newline><gray>Clic izquierdo · Posición 1<newline>Clic derecho · Posición 2</gray><newline><newline><white>Importa solo lo que necesites:</white><newline><aqua>/ds select region blocks</aqua><newline><aqua>/ds select region entities</aqua><newline><aqua>/ds select region all</aqua><newline><newline><gray>La región se convierte en objetos exactos. Después puedes quitar piezas individuales.</gray>"
guide.page.5: "<aqua><bold>04 · GUARDAR</bold></aqua><newline><gray>────────────</gray><newline><newline><aqua>/ds save [nombre]</aqua><newline><gray>Crea o actualiza una decoración.<newline>El mundo permanece igual.</gray><newline><newline><aqua>/ds update [nombre]</aqua><newline><gray>Actualización explícita.</gray><newline><newline><gold>Anchor opcional</gold><newline><gray>Usa /ds anchor set solo si quieres cambiar la referencia de casa.</gray>"
guide.page.6: "<aqua><bold>05 · PACK / PLACE / REMOVE</bold></aqua><newline><gray>────────────</gray><newline><newline><aqua>/ds pack [nombre]</aqua><newline><gray>Guarda primero y retira solo lo seleccionado.</gray><newline><newline><aqua>/ds place [nombre]</aqua><newline><gray>Coloca en casa. Añade </gray><white>here</white><gray> para colocarlo donde estás.</gray><newline><newline><aqua>/ds remove [nombre]</aqua><newline><gray>Retira la instancia y restaura el estado anterior.</gray>"
guide.page.7: "<aqua><bold>06 · GRUPOS</bold></aqua><newline><gray>────────────</gray><newline><newline><aqua>/ds group create Navidad</aqua><newline><aqua>/ds group add Navidad Arbol</aqua><newline><aqua>/ds group add Navidad Luces</aqua><newline><newline><aqua>/ds place Navidad</aqua><newline><aqua>/ds remove Navidad</aqua><newline><newline><gray>Los mismos comandos funcionan para una decoración y para un grupo.</gray>"
guide.page.8: "<aqua><bold>07 · CAMBIOS</bold></aqua><newline><gray>────────────</gray><newline><newline><red>◆ ROJO = CAMBIO DETECTADO</red><newline><gray>Los administradores reciben contornos rojos y un mensaje con nombre, tipo y coordenadas.</gray><newline><newline><aqua>/ds changes [nombre]</aqua><newline><gray>Solicita un análisis inmediato.</gray><newline><newline><aqua>/ds save [nombre]</aqua><newline><gray>Actualiza la plantilla.</gray><newline><aqua>/ds save [nombre] --force</aqua><newline><gray>Confirma una sobrescritura.</gray>"
guide.page.9: "<aqua><bold>08 · SEGURIDAD</bold></aqua><newline><gray>────────────</gray><newline><newline><green>✓</green> <gray>Place crea el snapshot antes de tocar bloques.</gray><newline><green>✓</green> <gray>Remove comprueba conflictos.</gray><newline><green>✓</green> <gray>Solo se retiran entidades creadas por DecoSwap.</gray><newline><newline><gold>Nota del primer Pack</gold><newline><gray>Un bloque antiguo que DecoSwap nunca conoció no puede recuperarse mágicamente.</gray><newline><newline><click:open_url:'https://github.com/MrDinoCarlos/DecoSwap/wiki'><underlined><aqua>Ayuda avanzada → Wiki</aqua></underlined></click>"
